<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Marta & Flo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Instrument+Serif:ital@0;1&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFFFF;
    --cream-2:#F1F2E9;
    --card:#FCFCF9;
    --ink:#31371F;
    --ink-soft:#6B7256;
    --terracotta:#727F49;
    --terracotta-deep:#565F35;
    --olive:#AD8863;
    --olive-deep:#8C6C49;
    --gold:#A08249;
    --line:rgba(49,55,31,0.14);
    --shadow:0 10px 28px -18px rgba(49,55,31,0.28);
    --duo-tint:#4A5330;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1A1E12;
      --cream-2:#232919;
      --card:#232919;
      --ink:#E9EDD8;
      --ink-soft:#B7C0A0;
      --terracotta:#A2B679;
      --terracotta-deep:#87A05E;
      --olive:#D3AE84;
      --olive-deep:#B48F63;
      --gold:#C9A96C;
      --line:rgba(233,237,216,0.14);
      --shadow:0 10px 28px -18px rgba(0,0,0,0.5);
      --duo-tint:#232919;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --cream:#1A1E12;
    --cream-2:#232919;
    --card:#232919;
    --ink:#E9EDD8;
    --ink-soft:#B7C0A0;
    --terracotta:#A2B679;
    --terracotta-deep:#87A05E;
    --olive:#D3AE84;
    --olive-deep:#B48F63;
    --gold:#C9A96C;
    --line:rgba(233,237,216,0.14);
    --shadow:0 10px 28px -18px rgba(0,0,0,0.5);
    --duo-tint:#232919;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Mulish",system-ui,sans-serif;
    font-size:16px;
    line-height:1.6;
    padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
    color:var(--terracotta-deep);
  }
  a{color:inherit;}
  img,svg{max-width:100%;}
  .wrap{max-width:760px;margin:0 auto;}

  /* duotone photo treatment — unifies every photo with the site palette */
  .duo{position:relative;overflow:hidden;background:var(--cream-2);}
  .duo img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.08) brightness(1.04);
  }
  .duo::after{
    content:"";position:absolute;inset:0;
    background:var(--duo-tint);
    mix-blend-mode:multiply;
    opacity:.62;
  }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--terracotta-deep);
    font-weight:700;
    margin-bottom:10px;
    display:block;
  }
  section{padding-block:76px;position:relative;}
  section.tight{padding-block:56px;}

  /* ---------- nav ---------- */
  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:50;
    background:color-mix(in srgb, var(--cream) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .navbar{
    max-width:900px;margin:0 auto;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    padding-block:14px;
  }
  .brand{
    order:1;
    font-family:"Cormorant Garamond",serif;
    font-size:1.15rem;
    font-style:italic;
    font-weight:500;
  }
  .navactions{order:2;}
  .langbar{display:flex;gap:6px;}
  .langbtn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:"Mulish",sans-serif;
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.04em;
    border-radius:999px;
    padding:5px 10px;
    cursor:pointer;
  }
  .langbtn[aria-pressed="true"]{
    background:var(--terracotta);
    border-color:var(--terracotta);
    color:#fff;
  }
  .indexBtn{
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--line);border-radius:999px;
    width:36px;height:36px;padding:0;cursor:pointer;
    color:var(--ink-soft);
  }
  .indexBtn:hover{border-color:var(--terracotta-deep);color:var(--terracotta-deep);}
  .indexBtn svg{width:16px;height:16px;flex:none;}

  /* ---------- index modal ---------- */
  .index-overlay{
    position:fixed;inset:0;z-index:200;
    background:rgba(30,26,16,0.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:8vh 16px 40px;overflow-y:auto;
  }
  .index-overlay.open{display:flex;}
  .index-panel{
    background:var(--cream);border-radius:14px;
    max-width:820px;width:100%;
    padding:26px 22px 30px;
    box-shadow:var(--shadow);
  }
  .index-head{
    display:flex;align-items:center;justify-content:flex-end;
    margin-bottom:6px;
  }
  .index-close{
    background:none;border:none;cursor:pointer;
    font-size:1.7rem;line-height:1;color:var(--ink-soft);
    width:34px;height:34px;border-radius:999px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .index-close:hover{background:var(--card);color:var(--ink);}
  .index-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:12px;
  }
  .index-card{
    display:flex;flex-direction:row;align-items:center;gap:12px;
    padding:14px 16px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);text-decoration:none;color:inherit;
    transition:border-color .15s ease, transform .15s ease;
  }
  .index-card:hover{border-color:var(--terracotta-deep);transform:translateY(-2px);}
  .index-icon{
    width:32px;height:32px;border-radius:999px;flex:none;
    background:color-mix(in srgb, var(--terracotta) 16%, transparent);
    display:flex;align-items:center;justify-content:center;
    color:var(--terracotta-deep);
  }
  .index-icon svg{width:17px;height:17px;}
  .index-card-title{
    font-family:"Mulish",sans-serif;font-weight:700;font-size:0.92rem;color:var(--ink);
  }

  /* ---------- search ---------- */
  .search-panel{max-width:480px;}
  .search-box{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:999px;
    padding:10px 16px;color:var(--ink-soft);
  }
  .search-box svg{width:18px;height:18px;flex:none;}
  .search-box input{
    flex:1;border:none;outline:none;background:none;
    font-family:"Mulish",sans-serif;font-size:1rem;color:var(--ink);
  }
  .search-status{margin-top:14px;font-size:0.85rem;color:var(--ink-soft);text-align:center;}
  mark.search-hit{
    background:color-mix(in srgb, var(--terracotta) 35%, transparent);
    color:inherit;border-radius:2px;
  }
  mark.search-hit.search-current{
    background:var(--terracotta);color:#fff;
  }

  /* ---------- hero photo ---------- */
  .hero-photo{
    width:100vw;margin-left:calc(50% - 50vw);
    position:relative;overflow:hidden;padding:0;
    height:clamp(520px,86vh,820px);
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 58%;display:block;filter:brightness(0.9) saturate(0.92);}
  .hero-photo-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(20,18,10,0.32) 0%, rgba(20,18,10,0.24) 38%, rgba(20,18,10,0.5) 72%, rgba(20,18,10,0.82) 100%);
  }
  .hero-photo-text{
    position:absolute;left:0;right:0;bottom:0;padding:0 24px 42px;text-align:center;
  }
  .hero-photo-text h1{
    color:#fff;font-size:clamp(2.3rem,7.5vw,3.6rem);
    text-shadow:0 2px 22px rgba(0,0,0,.35);
  }
  .hero-photo-text .amp{color:#F0D9B5;font-style:italic;}
  .hero-photo-text .tagline{
    margin-top:12px;color:rgba(255,255,255,.94);font-size:1.05rem;
    text-shadow:0 1px 12px rgba(0,0,0,.35);
  }

  /* ---------- hero info ---------- */
  .hero-info{padding-top:44px;padding-bottom:44px;text-align:center;}
  .venue-name{
    font-family:"Instrument Serif",serif;
    font-style:italic;
    font-weight:400;
    font-size:1.9rem;
    letter-spacing:0.01em;
    color:var(--ink);
    display:inline-block;
  }
  .hero-info .datebig{
    margin-top:6px;
    color:var(--terracotta-deep);
    font-family:"Instrument Serif",serif;
    font-style:italic;
    font-weight:400;
    font-size:1.5rem;
    letter-spacing:0.01em;
  }
  .countdown{
    margin-top:34px;
    display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  }
  .countdown div{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 18px;
    min-width:76px;
    box-shadow:var(--shadow);
  }
  .countdown b{
    display:block;font-family:"Cormorant Garamond",serif;font-size:1.7rem;
    font-variant-numeric:tabular-nums;color:var(--terracotta-deep);
  }
  .countdown small{
    text-transform:uppercase;letter-spacing:0.08em;font-size:0.65rem;color:var(--ink-soft);
  }
  .cta-row{margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 26px;
    border-radius:999px;
    font-weight:700;font-size:0.9rem;letter-spacing:0.02em;
    text-decoration:none;
    border:1px solid transparent;
    cursor:pointer;
    font-family:"Mulish",sans-serif;
  }
  .btn-primary{background:var(--terracotta);color:#fff;}
  .btn-primary:hover{background:var(--terracotta-deep);}
  .btn-ghost{background:transparent;border-color:var(--terracotta-deep);color:var(--terracotta-deep);}
  .btn-ghost:hover{background:var(--terracotta-deep);color:#fff;}

  /* ---------- divider ---------- */
  .divider{width:100%;height:34px;display:block;color:var(--olive);opacity:.55;}

  /* ---------- story ---------- */
  .story{text-align:center;}
  .story p{
    max-width:62ch;margin:18px auto 0;
    font-size:1.08rem;color:var(--ink-soft);
  }
  .gallery{margin-top:36px;}
  .gallery-track{
    display:flex;gap:16px;overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:4px 4px 10px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .gallery-track::-webkit-scrollbar{display:none;}
  .gallery-item{
    flex:0 0 auto;width:74%;max-width:320px;
    scroll-snap-align:center;
  }
  .gallery-photo{
    width:100%;aspect-ratio:4/5;
    border-radius:4px;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .gallery-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-caption{
    margin-top:10px;text-align:center;
    font-family:"Cormorant Garamond",serif;font-style:italic;
    color:var(--ink-soft);font-size:1.05rem;
  }
  .gallery-hint{
    margin-top:2px;text-align:center;font-size:0.72rem;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);opacity:.65;
  }

  /* ---------- schedule ---------- */
  .timeline{max-width:560px;margin:44px auto 0;position:relative;}
  .timeline::before{
    content:"";position:absolute;left:23px;top:8px;bottom:8px;width:2px;
    background:var(--line);
  }
  .tl-item{
    position:relative;padding-left:76px;padding-bottom:38px;
    display:flex;flex-direction:column;justify-content:center;min-height:46px;
  }
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{
    position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;
    background:color-mix(in srgb, var(--terracotta) 12%, var(--card));
    border:1.5px solid var(--terracotta);
    display:flex;align-items:center;justify-content:center;
  }
  .tl-dot svg{width:24px;height:24px;stroke:var(--terracotta-deep);}
  .tl-time{
    font-family:"Cormorant Garamond",serif;color:var(--terracotta-deep);font-weight:600;font-size:1.1rem;
  }
  .tl-label{color:var(--ink-soft);margin-top:2px;}

  /* ---------- cards / two-col ---------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px;
    box-shadow:var(--shadow);
  }
  .card .icon{
    width:40px;height:40px;border-radius:50%;
    background:color-mix(in srgb, var(--olive) 16%, transparent);
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  }
  .card .icon svg{width:20px;height:20px;stroke:var(--olive-deep);}
  .card h3{font-size:1.2rem;margin-bottom:8px;}
  .card p{color:var(--ink-soft);margin:0 0 6px;}
  .tag{
    display:inline-block;margin-top:10px;
    font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--terracotta-deep);font-weight:700;
    background:color-mix(in srgb, var(--terracotta) 14%, transparent);
    padding:4px 10px;border-radius:999px;
  }
  a.tag{text-decoration:none;cursor:pointer;}
  a.tag:hover{background:color-mix(in srgb, var(--terracotta) 26%, transparent);}
  .tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .tag-row .tag{margin-top:0;}
  .center{text-align:center;}
  .section-head{text-align:center;max-width:560px;margin:0 auto 8px;}

  /* ---------- rsvp ---------- */
  .rsvp-box{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:36px;margin-top:36px;box-shadow:var(--shadow);
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;font-weight:700;font-size:0.85rem;margin-bottom:6px;
  }
  .field .hint{color:var(--ink-soft);font-size:0.8rem;margin-top:4px;}
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="tel"],
  .field input[type="number"],
  .field textarea,
  .field select{
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--cream);
    color:var(--ink);
    font-family:"Mulish",sans-serif;
    font-size:0.95rem;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .radiorow{display:flex;gap:10px;flex-wrap:wrap;}
  .radiochip{
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;
    cursor:pointer;font-size:0.88rem;background:var(--cream);
  }
  .radiochip input{margin-right:6px;}
  .radiochip:has(input:checked){
    background:var(--terracotta);border-color:var(--terracotta);color:#fff;
  }
  .rsvp-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
  .rsvp-note{margin-top:16px;font-size:0.82rem;color:var(--ink-soft);}
  .deadline-pill{
    display:inline-block;margin-top:18px;padding:8px 16px;border-radius:999px;
    background:color-mix(in srgb, var(--olive) 16%, transparent);
    color:var(--olive-deep);font-weight:700;font-size:0.82rem;
  }

  /* ---------- gifts ---------- */
  .gift-card{
    max-width:480px;margin:32px auto 0;text-align:center;
    background:var(--card);border:1px dashed var(--line);border-radius:6px;
    padding:32px;
  }

  .bank{
    margin-top:16px;padding:4px 10px;text-align:center;
  }
  .bank span{display:block;margin-top:2px;}
  .bank-label{
    font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--terracotta-deep);font-weight:700;
  }
  .bank-iban{
    font-size:0.75rem;font-weight:400;letter-spacing:0.04em;
    color:var(--ink);user-select:all;-webkit-user-select:all;word-break:break-word;
  }
  .bank-name{font-size:0.75rem;color:var(--ink-soft);}

  /* ---------- playlist ---------- */
  .playlist-form{
    display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;max-width:560px;margin-inline:auto;
  }
  .playlist-form input{flex:1;min-width:180px;}
  .playlist-link{
    display:block;text-align:center;margin-top:18px;color:var(--ink-soft);font-size:0.88rem;
  }

  /* ---------- todo (tourism) ---------- */
  .photo-box{width:100%;overflow:hidden;background:var(--cream-2);}
  .photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-box.wide{aspect-ratio:21/9;border-radius:4px;}
  .photo-box.card-photo{aspect-ratio:16/10;}
  .credit{display:block;font-size:0.68rem;color:var(--ink-soft);opacity:.7;margin-top:8px;letter-spacing:.02em;}
  .place-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:0;margin-top:24px;overflow:hidden;box-shadow:var(--shadow);
  }
  .place-body{padding:22px 26px 26px;}
  .place-card h3{font-size:1.3rem;margin-bottom:4px;}
  .place-card .dist{color:var(--terracotta-deep);font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;}
  .place-card p{color:var(--ink-soft);margin-top:10px;}
  .food-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px;
  }
  .food-card h3{font-size:1.1rem;margin-bottom:8px;}
  .food-card p{color:var(--ink-soft);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center;}
  .chip{
    background:var(--cream-2);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;font-size:0.8rem;color:var(--ink-soft);white-space:nowrap;
  }

  /* ---------- footer ---------- */
  footer{
    text-align:center;padding-block:70px 70px;font-size:0.88rem;
    position:relative;overflow:hidden;
    color:#F1E6D2;
    border-radius:4px;margin-bottom:24px;
  }
  .footer-photo{position:absolute;inset:0;z-index:0;}
  .footer-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;}
  .footer-photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(195deg, rgba(18,20,10,0.4) 0%, rgba(18,20,10,0.62) 55%, rgba(18,20,10,0.85) 100%);
  }
  footer > *{position:relative;z-index:1;}
  footer .fbrand{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.4rem;color:#fff;margin-bottom:14px;}
  footer .contacts{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:14px;}
  footer a{color:#F1E6D2;}

  /* reveal on scroll */
  .reveal{opacity:1;transform:none;}
  @media (prefers-reduced-motion: no-preference){
    .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease, transform .6s ease;}
    .reveal.in{opacity:1;transform:none;}
  }

  [data-lang-only]{display:none;}
</style>
</head>
<body>

<header class="top">
  <div class="navbar">
    <div class="brand">M <span style="color:var(--terracotta)">&amp;</span> F</div>
    <div class="navactions" style="display:flex;align-items:center;gap:10px;">
      <div class="langbar" id="langbar">
        <button class="langbtn" data-lang="es">ES</button>
        <button class="langbtn" data-lang="en">EN</button>
        <button class="langbtn" data-lang="de">DE</button>
      </div>
      <button class="indexBtn" id="searchBtn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="indexBtn" id="indexBtn" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="index-overlay" id="searchOverlay">
  <div class="index-panel search-panel" role="dialog" aria-modal="true" aria-label="Search">
    <div class="index-head">
      <button class="index-close" id="searchClose" aria-label="Close">&times;</button>
    </div>

  var current = "es";

  function applyLang(lang){
    current = lang;
    document.documentElement.lang = lang;
    var dict = T[lang];
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      if(dict[key] !== undefined){ el.textContent = dict[key]; }
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function(el){
      var key = el.getAttribute("data-i18n-html");
      if(dict[key] !== undefined){ el.innerHTML = dict[key]; }
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){
      var key = el.getAttribute("data-i18n-placeholder");
      if(dict[key] !== undefined){ el.placeholder = dict[key]; }
    });
    document.querySelectorAll("[data-lang-only]").forEach(function(el){
      var langs = el.getAttribute("data-lang-only").split(" ");
      el.style.display = langs.indexOf(lang) !== -1 ? "block" : "none";
    });
    document.querySelectorAll(".langbtn").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    try{ localStorage.setItem("boda_lang", lang); }catch(e){}
  }

  document.querySelectorAll(".langbtn").forEach(function(btn){
    btn.addEventListener("click", function(){ applyLang(btn.getAttribute("data-lang")); });
  });

  var initial = "es";
  try{
    var saved = localStorage.getItem("boda_lang");
    if(saved && T[saved]) initial = saved;
  }catch(e){}
  applyLang(initial);

  var indexClose = document.getElementById("indexClose");
  function openIndex(){ indexOverlay.classList.add("open"); }
  function closeIndex(){ indexOverlay.classList.remove("open"); }
  indexBtn.addEventListener("click", openIndex);
  indexClose.addEventListener("click", closeIndex);
  indexOverlay.addEventListener("click", function(e){
    if(e.target === indexOverlay) closeIndex();
  });
  indexOverlay.querySelectorAll(".index-card").forEach(function(a){
    a.addEventListener("click", closeIndex);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeIndex();
  });

  // search
  var searchBtn = document.getElementById("searchBtn");
  var searchOverlay = document.getElementById("searchOverlay");
  var searchClose = document.getElementById("searchClose");
  var searchInput = document.getElementById("searchInput");
  var searchStatus = document.getElementById("searchStatus");
  var searchMarks = [];
  var searchCurrent = -1;

  function openSearch(){
    searchOverlay.classList.add("open");
    setTimeout(function(){ searchInput.focus(); }, 50);
  }
  function closeSearch(){
    searchOverlay.classList.remove("open");
    clearSearchMarks();
    searchInput.value = "";
    searchStatus.textContent = "";
  }
  searchBtn.addEventListener("click", openSearch);
  searchClose.addEventListener("click", closeSearch);
  searchOverlay.addEventListener("click", function(e){
    if(e.target === searchOverlay) closeSearch();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeSearch();
  });

  function clearSearchMarks(){
    searchMarks.forEach(function(mark){
      var parent = mark.parentNode;
      if(!parent) return;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    });
    searchMarks = [];
    searchCurrent = -1;
  }

  function updateCurrentMark(){
    searchMarks.forEach(function(m, i){ m.classList.toggle("search-current", i === searchCurrent); });
  }

  function runSearch(query){
    clearSearchMarks();
    query = query.trim();
    if(query.length < 2){ searchStatus.textContent = ""; return; }
    var lower = query.toLowerCase();
    var main = document.querySelector("main");
    var walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node){
        if(!node.nodeValue || node.nodeValue.toLowerCase().indexOf(lower) === -1) return NodeFilter.FILTER_SKIP;
        var p = node.parentElement;
        if(p && (p.tagName === "SCRIPT" || p.tagName === "STYLE")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    var n;
    while((n = walker.nextNode())) nodes.push(n);

    nodes.forEach(function(node){
      var text = node.nodeValue;
      var lowerText = text.toLowerCase();
      var frag = document.createDocumentFragment();
      var lastIndex = 0;
      var idx = lowerText.indexOf(lower);
      while(idx !== -1){
        if(idx > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, idx)));
        var mark = document.createElement("mark");
        mark.className = "search-hit";
        mark.textContent = text.slice(idx, idx + query.length);
        frag.appendChild(mark);
        searchMarks.push(mark);
        lastIndex = idx + query.length;
        idx = lowerText.indexOf(lower, lastIndex);
      }
      if(lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.parentNode.replaceChild(frag, node);
    });

    if(searchMarks.length === 0){
      searchStatus.textContent = T[current]["search.no_results"];
    } else {
      searchCurrent = 0;
      updateCurrentMark();
      searchStatus.textContent = searchMarks.length === 1 ? T[current]["search.one_result"] : (searchMarks.length + " " + T[current]["search.results"]);
      searchMarks[0].scrollIntoView({behavior:"smooth", block:"center"});
    }
  }

  searchInput.addEventListener("input", function(){ runSearch(searchInput.value); });
  searchInput.addEventListener("keydown", function(e){
    if(e.key === "Enter" && searchMarks.length > 0){
      e.preventDefault();
      searchCurrent = (searchCurrent + 1) % searchMarks.length;
      updateCurrentMark();
      searchMarks[searchCurrent].scrollIntoView({behavior:"smooth", block:"center"});
    }
  });

  // countdown
  var target = new Date("2027-06-26T13:00:00+02:00").getTime();
  function tick(){
    var now = Date.now();
    var diff = Math.max(0, target - now);
    var d = Math.floor(diff/86400000);
    var h = Math.floor((diff%86400000)/3600000);
    var m = Math.floor((diff%3600000)/60000);
    var s = Math.floor((diff%60000)/1000);
    var pad = function(n){ return String(n).padStart(2,"0"); };
    document.getElementById("cd-days").textContent = d;
    document.getElementById("cd-hours").textContent = pad(h);
    document.getElementById("cd-min").textContent = pad(m);
    document.getElementById("cd-sec").textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);

  // reveal on scroll
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, {threshold:0});
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
  }

  // RSVP -> mailto / whatsapp
  function buildRsvpText(){
    var dict = T[current];
    var count = document.getElementById("r-count").value.trim();
    var name = document.getElementById("r-name").value.trim();
    var contact = document.getElementById("r-contact").value.trim();
    var attending = document.querySelector('input[name="attending"]:checked').value;
    var allergies = document.getElementById("r-allergies").value.trim();
    var bus = document.querySelector('input[name="bus"]:checked').value;
    var msg = document.getElementById("r-msg").value.trim();

    var busLabel = {both:dict["rsvp.bus_both"], out:dict["rsvp.bus_out_only"], back:dict["rsvp.bus_back_only"], none:dict["rsvp.bus_none"]}[bus];
    var attLabel = attending === "yes" ? dict["rsvp.yes"] : dict["rsvp.no"];

    var lines = [
      "RSVP — Marta & Flo (26.06.2027)",
      "",
      dict["rsvp.count"] + ": " + count,
      dict["rsvp.name"] + ": " + name,
      dict["rsvp.contact"] + ": " + contact,
      dict["rsvp.attending"] + " " + attLabel,
      dict["rsvp.allergies"] + ": " + (allergies || "-"),
      dict["rsvp.bus"] + " " + busLabel,
      dict["rsvp.message"] + ": " + (msg || "-")
    ];
    return lines.join("\n");
  }

  var waBtn = document.getElementById("rsvpWaBtn");
  var rsvpForm = document.getElementById("rsvpForm");
  function updateWaLink(){
    waBtn.href = "https://wa.me/34661176937?text=" + encodeURIComponent(buildRsvpText());
  }
  rsvpForm.addEventListener("input", updateWaLink);
  rsvpForm.addEventListener("change", updateWaLink);
  waBtn.addEventListener("click", function(e){
    if(!rsvpForm.reportValidity()){ e.preventDefault(); return; }
    updateWaLink();
  });
  updateWaLink();

})();
</script>
